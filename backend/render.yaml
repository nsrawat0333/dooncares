services:
  - type: web
    name: dooncares-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dooncares-db
          property: connectionString

databases:
  - name: dooncares-db
    databaseName: dooncares
    user: dooncares_user
