[build]
  base = "frontend"
  publish = "dist"
  command = "npm run build"

# SPA Routing: Redirect all clean URLs to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Proxy /api requests to Render Python Backend (replace with your Render backend URL once deployed)
# Example:
# [[redirects]]
#   from = "/api/*"
#   to = "https://dooncares-backend.onrender.com/api/:splat"
#   status = 200
