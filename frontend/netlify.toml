[build]
  base = "frontend"
  publish = "dist"
  command = "npm run build"

# 301 Permanent Redirect: Remove /index.html from Google Search URLs
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

# SPA Routing: Redirect all clean URLs to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
